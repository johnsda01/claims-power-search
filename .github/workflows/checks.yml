name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check release tag matches version stamp
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          release_version="$(cat VERSION | tr -d '[:space:]')"
          if [ "$GITHUB_REF_NAME" != "v$release_version" ]; then
            echo "Release tag must match VERSION ($release_version)."
            exit 1
          fi
